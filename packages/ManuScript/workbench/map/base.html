const chapters=[{"id": "abstract", "title": "Abstract", "text": "A-Lab links computational candidates to experimental synthesis. This educational reconstruction follows how the reported evidence changed.\n\nThe unit of analysis is one synthesis target, but the unit of verification is a reported outcome. These two sets need not be the same size. We use the published A-Lab study and its later correction to track what changes when outcomes are revisited. The purpose is to explain an evidentiary distinction rather than reproduce a materials experiment. See \\cite{szymanski2023,correction2026}. This manuscript is a teaching adaptation, not the authors' submitted paper."}, {"id": "intro", "title": "Introduction", "text": "Predicting a candidate compound does not establish that a proposed route produces the target phase. The distinction motivates an experimental workflow.\n\nAn autonomous experiment has to choose what to try next as well as carry out the chosen steps. The design question is therefore broader than automating powder handling. It includes deciding which information a candidate list supplies, which choices require a synthesis recipe, and what observation would count as evidence that a target actually formed. These questions define the boundaries of this reconstruction."}, {"id": "gap", "title": "From screening to synthesis", "text": "A ranked list of candidates is a starting point. The synthesis route and the resulting product still need to be assessed.\n\nA candidate predicted to be stable is not a recipe. It does not, by itself, specify a successful combination of starting materials and processing conditions. Nor does the output of a screening step identify the phases present in a physical sample. In the study, candidate generation and experimental identification are linked operations. Their outputs must remain distinguishable in a report."}, {"id": "method", "title": "Methodology", "text": "The study combines prior materials information, recipe design and robotic synthesis. Diffraction measurements inform assessment of the products.\n\nThe published workflow brings together computational selection, recipes informed by earlier literature, robotic experiments and interpretation of diffraction patterns. In this reconstruction we trace the role of each record rather than train a new model. A suggested recipe is recorded as a proposal; a measurement is recorded as an observation; an interpretation of that measurement is recorded separately. This distinction permits a later assessment to revise the interpretation without erasing what the instrument recorded. See \\cite{szymanski2023}."}, {"id": "results", "title": "Results", "text": "The updated report counts 36 successes among 57 targets.\nFour of the 40 reported successes remained inconclusive after review. The campaign-level ratio is $36/57$, whereas the reassessment concerns a subset. See \\cite{correction2026}."}, {"id": "discussion", "title": "Discussion", "text": "An inconclusive diffraction result is not by itself evidence of synthesis failure.\n\nAn experimental claim must specify both the observed signal and the decision inferred from it. The author correction illustrates why evidence insufficient to identify a phase must not be described as proof that synthesis failed. It also distinguishes novelty for the prediction platform from novelty to science. An author resolving a reviewer comment should therefore specify whether the change affects a label, a sample set, or the scientific interpretation. See \\cite{correction2026}."}, {"id": "conclusion", "title": "Conclusion", "text": "The distinction between predicted candidates and verified outcomes matters when reporting an autonomous synthesis campaign.\n\nA single headline number cannot describe both the yield of a target campaign and agreement with a later assessment. The report should preserve the population counted, the denominator and the source for each statement. The resulting account concerns the cited powder  items.push('<div role="treeitem" aria-selected="'+(id===selected)+'" data-id="'+E(id)+'"  class="topic '+(n.sectionPending?'sectionPending ':n.section!=null?'sectionTopic ':'')+(depth===0?'root ':depth===1?'major ':'')+(n.closed?'collapsed ':'')+(selected===id?'selected ':'') +(n.ghost?'draft':'')+'" data-state="'+E(st)+'" title="'+E((n.detail?n.detail+' · ':'')+(n.source?n.source+' · ':'')+labels[st]+(n.origin==='agent'?' · 创建：Agent':'')+(n.review==='confirmed'?' · 作者已确认':''))+'">'+(depth===1?'<span aria-hidden="true" class="num">'+String(idx+1).padStart(2,'0')+'</span>':'')+'<span class="label">'+E(depth===1?n.t.replace(/^0?\d+[.、\s]+/,''):n.t)+'</span>'+(depth===1&&n.closed&&children.get(id)?.some(x=>x.kind==='主张')?'<span class="thesis">'+E(children.get(id).find(x=>x.kind==='主张').t)+'</span>':'')+(n.sectionQuotes||[]).map(q=>'<blockquote class="sectionQuote" title="'+E(q.text)+'">'+E(q.text)+'</blockquote>').join('')+(n.section!=null||n.sectionPending?'':nodeStamps(n))+mapMediaHTML(n)+(window.lxMapNoteHTML?.(id)||'')+(children.has(id)&&!ed?'<button class="fold" title="折叠或展开" data-fold="'+E(id)+'">'+(n.closed?'＋':'−')+'</button>':'')+'</div>');
 cs.forEach((c,i)=>build(c,depth+1,i))}
 build(source.find(n=>n.id==='root'),0,0);
 const focused=world===W&&document.activeElement?.closest('.mapNoteEditor')?document.activeElement:null;world.innerHTML='<svg aria-hidden="true"></svg>'+items.join('');const nodes=world.querySelectorAll('.topic');for(const el of nodes){const v=pts[el.dataset.id];v.el=el;if(world===W)window.lxMountNote?.(v);v.w=el.offsetWidth;v.h=el.offsetHeight;if(v.n.p&&!v.n.ghost&&!v.n.sectionPending&&v.n.section==null){const label=document.createElement('button');label.className='edgeText';label.dataset.edge=v.n.id;label.textContent=v.n.relation||'＋';label.title='编辑连线文字：'+(v.n.relation||v.n.t);label.setAttribute('aria-label',label.title);if(!v.n.relation)label.classList.add('empty');world.append(label);v.edge=label}}
 if(focused?.isConnected)focused.focus({preventScroll:true});const gap=d=>d===0?38:36;
 function measure(v){const sum=v.cs.reduce((a,c)=>a+measure(pts[c.id]),0);v.stack=sum+Math.max(0,v.cs.length-1)*gap(v.depth);return v.span=Math.max(v.h,v.stack)}
 const top=pts.root;measure(top);let right=0;const lines=[];
 function path(d,c,width,dash='',edge=null){lines.push('<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+width+'" stroke-linecap="round" stroke-linejoin="round" '+(dash||(edge?'stroke-dasharray="4 3"':''))+'/>');if(edge)lines.push('<path class="mapEdgeHit" data-edge="'+E(edge)+'" d="'+d+'" fill="none" stroke="transparent" stroke-width="14"/>')}
 function place(v,x,y){v.x=x;v.y=y;right=Math.max(right,x+v.w);v.el.style.left=x+'px';v.el.style.top=y+'px';
 let cursor=y-v.stack/2;const ax=x+v.w,g=Math.max(v.depth===0?68:54,...v.cs.map(c=>(pts[c.id].edge?.offsetWidth||0)+52)),bx=ax+g,mid=ax+23;
 v.cs.forEach(c=>{const k=pts[c.id];place(k,bx,cursor+k.span/2);if(k.edge){k.edge.style.left=(mid+(bx-mid)/2)+'px';k.edge.style.top=k.y+'px'}cursor+=k.span+gap(v.depth)});
 if(!v.cs.length)return;const ks=v.cs.map(c=>pts[c.id]),a=ks[0].y,b=ks.at(-1).y,ink='var(--wire)',line=v.depth?1.5:2;
 if(ks.length>1){const r=Math.min(7,(b-a)/2);path('M '+(mid+r)+' '+a+' Q '+mid+' '+a+' '+mid+' '+(a+r)+' V '+(b-r)+' Q '+mid+' '+b+' '+(mid+r)+' '+b,ink,line);path('M '+ax+' '+y+' H '+mid,ink,line);ks.forEach((k,i)=>path('M '+(mid+(i===0||i===ks.length-1?r:0))+' '+k.y+' H '+bx,ink,line,k.n.ghost?'stroke-dasharray="3 3"':'',k.n.id))}

function center(){const w=vp.clientWidth,h=vp.clientHeight,pad=Math.min(36,w*.08);if(!w||!h)return;zoom=Math.min(1,Math.max(1,w-2*pad)/Math.max(bounds.w,1),Math.max(1,h-2*pad)/Math.max(bounds.h,1));tx=(w-bounds.w*zoom)/2-(bounds.left||0)*zoom;ty=h/2;paint()}

// Chromium synthesizes Ctrl+wheel for a pinch without a physical Control keydown.
let safariPinch=null,controlDown=false;

function anchor(e){const r=vp.getBoundingClientRect();return [Number.isFinite(e.clientX)?e.clientX-r.left:r.width/2,Number.isFinite(e.clientY)?e.clientY-r.top:r.height/2]}
